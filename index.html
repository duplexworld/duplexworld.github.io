<script>
mountFlight(document.getElementById('world'), {
  shell: 'split',
  // THE OPENING. Not a stop: a block in normal flow, one viewport tall, that scrolls up
  // and off with the reader. Three by three with the mark in the middle cell. Nothing in
  // it fades and nothing in it moves - it simply leaves, the way the first screen of a
  // page should. Cells are given in reading order and the mark is inserted at index 4.


  // The dots go: a column of unlabelled marks is a slide-deck affordance, and this is a
  // page that is read by scrolling.
  rail: false,
  // The bar across the top. Each entry names a real section and spans to `to`, so the one
  // that lights is whichever range the reader is actually inside.
  hero: { src: 'img/hero.webp', w: 1222, h: 1254 },
  logo: { src: 'img/hero.webp' },
  maps: { base: './' },
  calls: { base: './' },
  // Every world, always on screen, each pointing at its own results stop - which is also
  // the moment the film is inside that world, so clicking one is a real flight to it.
  hint: 'scroll',
  opening: {
    title: 'DuplexWorld: Can voice agents help you get through the day?',
    mark: 'img/hero.webp',
    markAlt: 'The DuplexWorld mark: the six worlds under one dome',
    cells: [
      { label: 'The paper', wide: true, text:
        'Six worlds of an ordinary day, eleven conversation types and one twelve-metric '
        + 'suite in three pillars, held under a single harness. Across 3,825 scored '
        + 'conversations, none of the five commercial speech-to-speech systems evaluated '
        + 'exceeds Pass@1 0.490, turn-taking 0.653 or DNSMOS 3.378 pooled over the worlds. '
        + 'A different system leads each of the three.' },
      // Figure 2(a)'s third panel, lifted from the submission at print resolution rather
      // than redrawn: it is a density per world and the paper does not publish the
      // durations behind it, so drawing our own would be inventing the shape.
      // The submission's own Figure 1 panel, cropped from the arXiv page rather than
      // redrawn: it already carries the two totals as rings, so the stat rows that used to
      // sit above it were saying the same thing twice.
      // Conversations by world, as a ring. Six slices, five of them equal by design, so
      // there is one shape to read rather than eleven: the point is that the five
      // enterprise worlds are balanced and Pathfinding is two thirds their size.
      // Labelled directly on the arc, no legend, and the counts are stated.
      { label: 'The corpus', items: [
        ['387 h', 'of simulated speech'], ['156', 'scenarios'], ['5', 'systems'],
      ], ring: {
        centre: '3,825', centreSub: 'total', keyHead: 'Conversations by world',
        slices: [
          ['Banking', 675], ['Insurance', 675], ['Travel', 675],
          ['Healthcare', 675], ['Logistics', 675], ['Pathfinding', 450],
        ] } },
      { label: 'Six worlds', worlds: [
        ['Pathfinding', 'img/pathfinding.webp'], ['Banking', 'img/banking.webp'],
        ['Healthcare', 'img/healthcare.webp'], ['Travel', 'img/travel.webp'],
        ['Insurance', 'img/insurance.webp'], ['Logistics', 'img/logistics.webp'],
      ] },
      { label: 'Eleven conversation types', chips: [
        'Single intent', 'Multi intent', 'Policy refusal', 'Record disambiguation',
        'Identity verification', 'Guided procedure', 'Mid-call correction',
        'Suspension', 'Narrative intake', 'Rerouting', 'All-day assistance',
      ] },
      { label: 'Pass@1', head: { v: '0.490', who: 'Voice Think Fast' },
        plot: { accent: 'var(--pillar-agentic)', dp: 3, max: 0.55, rows: [
        ['Voice Think Fast', 0.490, 0.039], ['GPT-Realtime-2.1', 0.433, 0.035],
        ['Gemini-3.1-Flash-Live', 0.398, 0.039], ['GPT-Realtime-2.1-mini', 0.188, 0.028],
        ['Nova 2 Sonic', 0.011, 0.007]],
        note: '0.011: the system that holds the floor without completing tasks.' } },
      { label: 'Turn-taking', head: { v: '0.653', who: 'GPT-Realtime-2.1' },
        plot: { accent: 'var(--pillar-dynamics)', dp: 3, max: 0.72, rows: [
        ['GPT-Realtime-2.1', 0.653, 0.018], ['Voice Think Fast', 0.635, 0.015],
        ['Nova 2 Sonic', 0.566, 0.021], ['GPT-Realtime-2.1-mini', 0.521, 0.025],
        ['Gemini-3.1-Flash-Live', 0.388, 0.012]] } },
      { label: 'DNSMOS', head: { v: '3.378', who: 'Gemini-3.1-Flash-Live' },
        plot: { accent: 'var(--pillar-natural)', dp: 2,
          note: 'This axis starts at 3.0, not 0: DNSMOS is a 1-to-5 opinion score and the '
              + 'five systems sit inside a quarter of a point of each other.', base: 3.0, max: 3.45, rows: [
        ['Gemini-3.1-Flash-Live', 3.378, 0.008], ['GPT-Realtime-2.1', 3.350, 0.004],
        ['GPT-Realtime-2.1-mini', 3.334, 0.009], ['Nova 2 Sonic', 3.172, 0.015],
        ['Voice Think Fast', 3.127, 0.007]] } },
    ],
  },
  nav: [
    { label: 'Conversation types', at: 'types9' },
    { label: 'Voice samples', href: 'samples.html' },
    { label: 'Metrics', at: 'pillars3' },
    { label: 'Results', href: 'results.html' },
  ],
  video: { src: 'flight.mp4', poster: 'img/poster.webp',
    // One entry per section, in section order. A length mismatch is not a soft
    // failure: the config is rejected and the film is dropped for the page.
    stops: [2.00, 4.00, 7.50, 103.50] },
  sections: [
    {
      id: 'walks', label: 'Pathfinding types', block: 'band', stage: 'film', still: null,
      lede: 'The agent holds the map. The walker holds the street. Neither can see what '
          + 'the other sees.',
      navCards: [
        { name: 'Single intent',
          line: 'Five blocks, two turns, nothing closed. The control condition.' },
        { name: 'Rerouting',
          line: 'Four closures the copilot\u2019s map does not show. Exactly one detour survives.' },
        { name: 'All-day assistance',
          line: 'A second destination, revealed only on arrival at the first.' },
      ],
      cam: { x: 0.346, y: 0.601, z: 1.75 }, scroll: 4.7, linger: 0.5, steps: 4,
      accent: 'var(--mag)',
      mark: { name: 'Pathfinding', line: 'Three conversation types, each shown solved and unsolved.' },
      // No paragraph. The tiles are the argument, the types are named on them, and the
      // paper already explains each one at length.
      maps: {
        cols: 3,
        // Figures 3, 4 and 5. Each pair shares a start, a destination and a closure set, so
        // the contrast between two tiles isolates the agent. The failures are marked as
        // failures and nothing more: which cap they hit is a detail for the paper.
        cells: [
          { key: 'clean', at: 0, outcome: 'ok', cond: 'Single intent', verdict: 'Solved',
            note: 'Five blocks of five, two turns, no closures.' },
          { key: 'blocked_ok', at: 1, outcome: 'ok', cond: 'Rerouting', verdict: 'Solved',
            note: 'Four unmapped closures; finds the one detour that survives.' },
          { key: 'errand_ok', at: 2, outcome: 'ok', cond: 'All-day assistance', verdict: 'Solved',
            note: 'The second destination is revealed only on arrival at the first.' },
          { key: 'wander', at: 0, outcome: 'bad', cond: 'Single intent', verdict: 'Failed',
            note: 'The same instance, three times the route.' },
          { key: 'blocked_bad', at: 1, outcome: 'bad', cond: 'Rerouting', verdict: 'Failed',
            note: 'The same closures, never resolved.' },
          { key: 'errand_bad', at: 2, outcome: 'bad', cond: 'All-day assistance', verdict: 'Failed',
            note: 'Ends with the walker believing they had arrived.' },
        ],
      },
    },
    // ------------------------------------------------- the nine enterprise conversation types
    {
      id: 'types9', label: 'Conversation types', stage: 'film', still: null,
      // Its own block: nine cards want every column they can get, and the film beside them
      // is context rather than evidence here, so the panel keeps its width and the graphic
      // gives ground instead.
      block: 'band',
      cam: { x: 0.500, y: 0.470, z: 1.00 }, scroll: 4.0, linger: 0.4,
      accent: 'var(--pillar-agentic)',
      cardsLede: 'Nine shapes, shared by all five enterprise worlds.',
      cards: TYPES9,
      cardsFoot: 'Plus two that only navigation elicits: rerouting, and all-day assistance.',
    },
    {
      id: 'pillars3', label: 'The metrics', stage: 'film', still: null,
      // Three columns of eleven metric cards, a worked example and the callout do not fit
      // one viewport beside a film. This is the section the directive asks to be three
      // full-width columns, so the stage stands down and the evidence takes the page.
      block: 'band',
      cam: { x: 0.500, y: 0.470, z: 1.00 }, scroll: 5.3, linger: 0.4,
      accent: 'var(--pillar-dynamics)',
      // The definitions on their own were a glossary the paper already has. This is the
      // same five runs of one Pathfinding scenario that the numbers beside them come from,
      // so a reader watches GS, Pass@1 and Pass-cubed fall out of one set of runs and can
      // see they are three different questions rather than three spellings of one.
      worked: {
        label: 'One scenario, five runs',
        optimal: 7,
        limit: 0.75,
        runs: [{ blocks: 8 }, { blocks: 19 }, { blocks: 7 }, { blocks: 9 }, { blocks: 0 }],
      },
      // Three pillars, each a column with its own colour, and every metric stated four
      // ways: symbol, full name, one plain sentence for a reader who has not read the
      // paper, and the range with its direction. The glossary this replaces named the
      // metrics without ever saying what they mean or which way is better.
      pillarCols: [
        { name: 'Agentic capability', tint: 'var(--pillar-agentic)',
          line: 'Did it do the job.',
          metrics: [
            { sym: 'GS', full: 'Goal state',
              says: 'Did the world end up the way the task asked, whatever was said on the way.',
              range: '[0,1] \u00b7 higher is better' },
            { sym: 'Pass@1', full: 'Single-run pass rate',
              says: 'How often one attempt succeeds. This is the headline number.',
              range: '[0,1] \u00b7 higher is better' },
            { sym: 'Pass@3', full: 'Any of three',
              says: 'At least one success in three independent attempts. Rewards a system that is sometimes right.',
              range: '[0,1] \u00b7 higher is better' },
            { sym: 'Pass\u00b3', full: 'All of three',
              says: 'All three attempts succeed. This is the reliability question, and it is where systems separate.',
              range: '[0,1] \u00b7 higher is better' },
          ] },
        { name: 'Conversational dynamics', tint: 'var(--pillar-dynamics)',
          line: 'How the conversation went.',
          metrics: [
            { sym: 'TT', full: 'Turn-taking',
              says: 'Who held the channel, who yielded, and how often the two talked over each other.',
              range: '[0,1] \u00b7 higher is better' },
            { sym: 'CP', full: 'Conversation progression',
              says: 'Whether each turn moved the task forward rather than circling.',
              range: '[1,3] \u00b7 higher is better' },
            { sym: 'SEL', full: 'Selectivity',
              says: 'Whether the agent ignored what was not addressed to it: background speech, asides, a second voice in the room.',
              range: '[0,1] \u00b7 higher is better' },
          ] },
        { name: 'Naturalness', tint: 'var(--pillar-natural)',
          line: 'How it sounded.',
          metrics: [
            { sym: 'FAI', full: 'Faithfulness',
              says: 'Whether what the agent said was true of the world it was acting in.',
              range: '[1,3] \u00b7 higher is better' },
            { sym: 'DNSMOS', full: 'Speech quality (DNSMOS)',
              says: 'A predicted mean opinion score for the audio, from a model trained on human ratings.',
              range: '[1,5] \u00b7 higher is better' },
            { sym: 'UTMOS', full: 'Speech quality (UTMOS)',
              says: 'A second, independently trained MOS predictor. Three are reported because they disagree.',
              range: '[1,5] \u00b7 higher is better' },
            { sym: 'NISQA', full: 'Speech quality (NISQA)',
              says: 'A third MOS predictor, on a different training set again.',
              range: '[1,5] \u00b7 higher is better' },
          ] },
      ],
      callout: {
        head: 'We never combine these into a single score.',
        body: 'A system that says nothing scores near-perfect selectivity and competitive '
            + 'turn-taking. Any composite that averages across the pillars can be won by '
            + 'silence.',
      },
    },
    // ------------------------------------------- Pass@1 against the conversation types
    {
      id: 'out', label: 'Duplex World', stage: 'film', still: null, layout: 'hero',
      block: 'out',
      cam: { x: 0.500, y: 0.480, z: 1.02 }, scroll: 1.8, linger: 0.3,
      accent: 'var(--mag)',
    },
  ],
});
</script>
