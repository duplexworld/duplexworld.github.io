<!-- Inline so the browser never fires its automatic /favicon.ico request, which is a
     404 on a static server and the only broken asset the page would otherwise have. -->

     a ring and a bar in the retired palette: a placeholder that read as an unfinished

     otherwise cycle the header before reaching any content. -->
<a class="fw-skip" href="#world">Skip to the page</a>

<header class="topbar" data-nav-host>
  <a class="wordmark" href="index.html"><img class="wordmark-logo" src="img/hero.webp" alt="">Duplex&nbsp;World <span class="sub">benchmark</span></a>
</header>

<main id="world"></main>

<!-- The walk renderer. Loaded before the flight so the map tiles can mount the moment their
     payloads land; if it is missing the flight still runs and the tiles stay as placeholders
     rather than throwing. -->
<script src="walkmap.js"></script>
<script>
window.__DW_ICONS = {
  openai: 'img/icons/openai.webp', gemini: 'img/icons/gemini.webp',
  grok: img/icons/grok.webp, nova: img/icons/nova.webp,
};
</script>
<script src="data.js"></script>
<script>window.__DW_AUTHORS = {"people": [{"name": "Aryan Vijay Bhosale", "sup": "1,2*"}, {"name": "Harshit Rajgarhia", "sup": "1*"}, {"name": "Akhil Pothanapalli", "sup": "1*"}, {"name": "Asif Shaik", "sup": "1"}, {"name": "Abhishek Mukherji", "sup": "1†"}, {"name": "Dinesh Manocha", "sup": "2†"}], "affiliations": [{"sup": "1", "name": "Centific Global Solutions Inc.", "href": "https://www.centific.com/research/applied-ai-research"}, {"sup": "2", "name": "University of Maryland", "href": "https://www.cs.umd.edu/"}], "email": "{aryan.bhosale, harshit.rajgarhia}@centific.com", "notes": ["Work done during an internship at Centific.", "* Equal contribution.  † Equal advising."]};</script>
<script src="flight.js"></script>
<script>
mountFlight(document.getElementById('world'), {
  shell: 'split',
  // THE OPENING. Not a stop: a block in normal flow, one viewport tall, that scrolls up
  // and off with the reader. Three by three with the mark in the middle cell. Nothing in
  // it fades and nothing in it moves - it simply leaves, the way the first screen of a
  // page should. Cells are given in reading order and the mark is inserted at index 4.


  // The dots go: a column of unlabelled marks is a slide-deck affordance, and this is a
  // page that is read by scrolling.
  rail: false,
  // The bar across the top. Each entry names a real section and spans to `to`, so the one
  // that lights is whichever range the reader is actually inside.
  hero: { src: 'img/hero.webp', w: 1222, h: 1254 },
  logo: { src: 'img/hero.webp' },
  maps: { base: './' },
  calls: { base: './' },
  // Every world, always on screen, each pointing at its own results stop - which is also
  // the moment the film is inside that world, so clicking one is a real flight to it.
  hint: 'scroll',
  nav: [
    { label: 'Conversation types', href: 'index.html' },
    { label: 'Voice samples', href: 'samples.html' },
    { label: 'Metrics', href: 'index.html' },
    { label: 'Results', at: 'pathfinding-pass' },
  ],
  globes: [
    // Indices, so they drift the moment a stop is inserted: every one of these was two
    // out after the recorded-runs stop went in, and clicking "Banking" landed on a chart.
    // verify_paper.py now asserts each globe reaches the section whose id it names.
    { label: 'Pathfinding', src: 'img/pathfinding.webp', stop: 0 },
    { label: 'Banking',     src: 'img/banking.webp',     stop: 1 },
    { label: 'Healthcare',  src: 'img/healthcare.webp',  stop: 2 },
    { label: 'Travel',      src: 'img/travel.webp',      stop: 3 },
    { label: 'Insurance',   src: 'img/insurance.webp',   stop: 4 },
    { label: 'Logistics',   src: 'img/logistics.webp',   stop: 5 },
  ],
  video: { src: 'flight.mp4', poster: 'img/poster.webp',
    // One entry per section, in section order. A length mismatch is not a soft
    // failure: the config is rejected and the film is dropped for the page.
    // Non-decreasing, which the validator requires and the flight needs: the camera
    // only ever moves forward through the film. The three bands after the worlds
    // stand the stage down anyway, so they ride just past the last world dive.
    stops: [12.00, 29.00, 45.00, 61.00, 77.00, 93.00, 96.00, 99.00, 101.00, 103.50] },
  sections: [
    {
      id: 'pathfinding-pass', label: 'Pathfinding', stage: 'film', still: null,
      cam: { x: 0.346, y: 0.601, z: 1.75 }, scroll: 7.8, linger: 0.42,
      accent: 'var(--pillar-agentic)',
      // Same treatment as the other five: the name and the globe carry it.
      mark: { name: 'Pathfinding' },
      plate: { name: 'Pathfinding', img: 'img/pathfinding.webp' },
      block: 'band',
      bars: {
        label: 'Pass@1, Pathfinding',
        metric: 'Pass@1',
        max: 0.7,
        rows: [
          { system: 'Voice Think Fast', v: 0.533, pm: 0.133 },
          { system: 'Gemini-3.1-Flash-Live', v: 0.489, pm: 0.133 },
          { system: 'GPT-Realtime-2.1', v: 0.200, pm: 0.111 },
          { system: 'GPT-Realtime-2.1-mini', v: 0.089, pm: 0.078 },
          { system: 'Nova 2 Sonic', v: 0.000, pm: 0.000 },
        ],
      },
      pillars: { rowHead: 'System', groups: PILLARS, best: HIGH, rows: T3_PATHFINDING },
    },
    // ---------------------------------------------------------------- the six worlds
    world('banking', 'Banking',
      '',
      T3_BANKING,
      'Banking, realistic channel, n = 135 conversations per cell. The clause corpus is withheld '
      + 'from the system prompt, so knowing when to look something up is itself under test. The '
      + 'lowest reward of the six worlds.'),
    world('healthcare', 'Healthcare',
      '',
      T3_HEALTHCARE,
      'Healthcare, realistic channel, n = 135 conversations per cell. A fully verified subscriber '
      + "may be refused her adult daughter's claim while a daughter named as an authorised "
      + "representative may act on her mother's, so a caller who passes every check can still be "
      + 'entitled to nothing. The capability isolated is refusing without leaking in the act of '
      + 'refusing.'),
    world('travel', 'Travel',
      '',
      T3_TRAVEL,
      'Travel, realistic channel, n = 135 conversations per cell. Restraint is scored by negative '
      + 'assertion and write-counting rather than end state: the assertion asks whether a listing '
      + 'was paused exactly once, because a duplicate write leaves the database looking identical '
      + 'to a correct run. The highest single cell in the benchmark, and the world with the '
      + 'heaviest over-effort.'),
    world('insurance', 'Insurance',
      '',
      T3_INSURANCE,
      'Insurance, realistic channel, n = 135 conversations per cell. Authority is fixed per '
      + 'policyholder and the refusal is institutional rather than statutory. Several such '
      + 'regimes are enforced in the tool surface itself, which makes the unsafe behaviour '
      + 'unrepresentable rather than merely discouraged.'),
    world('logistics', 'Logistics',
      '',
      T3_LOGISTICS,
      'Logistics, realistic channel, n = 135 conversations per cell. It has the least to refuse '
      + 'of the five enterprise worlds, and the smallest gap between reaching the right state '
      + 'and completing the task: plus 0.093 against plus 0.381 in Banking.'),
    // ---------------------------------------------------------------- the way out
    // The film takes CENTRE stage and the copy steps aside. The chain's outro is the camera
    // pulling back out of the last world to the whole dome, which is the opening in reverse,
    // and it is the last thing on the page.
    {
      id: 'bytype', label: 'Pass@1 by type', stage: 'film', still: null,
      block: 'band',
      cam: { x: 0.500, y: 0.470, z: 1.00 }, scroll: 5.0, linger: 0.4,
      accent: 'var(--pillar-agentic)',
      lede: 'Rerouting costs every system most of its reward: no system exceeds Pass@1 0.27.',
      bars: {
        label: 'Pooled over the six worlds',
        metric: 'Pass@1',
        max: 0.6,
        rows: [
          { system: 'Voice Think Fast', v: 0.490, pm: 0.039 },
          { system: 'GPT-Realtime-2.1', v: 0.433, pm: 0.035 },
          { system: 'Gemini-3.1-Flash-Live', v: 0.398, pm: 0.039 },
          { system: 'GPT-Realtime-2.1-mini', v: 0.188, pm: 0.028 },
          { system: 'Nova 2 Sonic', v: 0.011, pm: 0.007 },
        ],
      },
      // Small multiples: nine panels on ONE shared scale, which is the whole point - a
      // panel per type is only comparable if the axis does not move between them. The
      // Pathfinding types sit below a rule because their reward is a different definition
      // (arrival AND route efficiency at or above 0.75), and silently mixing them into the
      // nine would be comparing two different questions.
      multiples: {
        max: 0.8,
        systems: SYS5,
        note: 'Table 14 publishes a point estimate per conversation type and no interval, '
            + 'so these panels carry no whiskers. The pooled figures above, and every '
            + 'per-world table below, carry theirs.',
        groups: [
          { label: 'The nine enterprise types', rows: BY_TYPE_9.map(([name, v]) => ({ name, v })) },
          { label: 'Pathfinding, whose reward also requires route efficiency',
            apart: true, rows: BY_TYPE_3.map(([name, v]) => ({ name, v })) },
        ],
      },
    },
    // -------------------------------------------------- Pathfinding: the scores and the block
    // The camera is in conn_0 here, pulling up out of Pathfinding and turning towards
    // Banking, which is exactly what this stop is doing: it closes Pathfinding out with its
    // numbers and hands over to the five enterprise worlds.
    //
    // The chart and the table share a stop rather than taking one each. Pathfinding has only
    // one dive in the chain, and giving its numbers two stops would have meant one of them
    // sitting on a frame that belongs to another world.
    {
      id: 'matrix', label: 'Composition', stage: 'film', still: null,
      block: 'band',
      cam: { x: 0.500, y: 0.470, z: 1.00 }, scroll: 3.7, linger: 0.4,
      accent: 'var(--pillar-agentic)',
      eyebrow: '144 campaigned scenarios, by world and conversation type',
      matrix: { types: MATRIX_TYPES, rows: MATRIX_ROWS, split: 9,
        // What one cell is worth in conversations: five systems, three runs each, and
        // Pathfinding is run in both channels.
        systems: 5, runs: 3, channels: { Pathfinding: 2 },
        spans: ['Nine shared enterprise types', 'Pathfinding-only'],
        find: 'Every enterprise world instantiates the same nine interaction shapes, three '
            + 'scenarios each. Pathfinding shares one and adds two that only navigation '
            + 'elicits.',
        foot: 'Plus twelve authored Pathfinding variants that are released but not run '
            + '(156 authored scenarios in total).' },
    },
    // ---------------------------------------------------------------- five recorded runs
    // One run per shape, drawn from the scored corpus. The two Pathfinding ones play the
    // walk; the three enterprise ones loop the turns where the type's own mechanic fires,
    // with the turn range chosen from the transcript rather than the call's opening.
    //
    // The identity-verification and suspension runs are Travel, not Banking: those are the
    // recorded calls that exist for those two types, and labelling a Travel call as Banking
    // to fill a slot would be the one thing this page cannot do.
    {
      id: 'durations', label: 'Duration', stage: 'film', still: null,
      block: 'band',
      cam: { x: 0.500, y: 0.470, z: 1.00 }, scroll: 3.7, linger: 0.4,
      accent: 'var(--pillar-dynamics)',
      eyebrow: 'How long a conversation runs, by world',
      // Every figure below is computed from the 3,825 conversation records in
      // figure1_durations/conversation_durations.csv by gen_violins.py, not transcribed:
      // the corpus mean is 6.07 minutes (14.9 is Pathfinding's own mean), 232 of
      // Pathfinding's 450 runs end at the cap, and 356 enterprise conversations end on
      // the wall-clock timeout.
      violins: { src: 'violins.json',
        find: 'Half of all conversations finish inside 4.8 minutes, but Pathfinding runs to a twenty '
            + 'minute cap and 232 of its 450 conversations end there rather than at a '
            + 'destination. The five enterprise worlds sit between three and eight '
            + 'minutes, and 356 of their conversations end on the wall-clock timeout.' },
    },
    {
      id: 'out', label: 'Duplex World', stage: 'film', still: null, layout: 'hero',
      block: 'out',
      cam: { x: 0.500, y: 0.480, z: 1.02 }, scroll: 1.8, linger: 0.3,
      accent: 'var(--mag)',
    },
  ],
});
</script>
</body>
</html>
