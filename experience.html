     payloads land; if it is missing the flight still runs and the tiles stay as placeholders

<script>
mountFlight(document.getElementById('world'), {
  shell: 'split',
  // No dots: a cinema has no chapter list down its right edge.
  rail: false,
  // The engine measures the stage from these; without them it cannot lay out at all.
  hero: { src: 'img/hero.webp', w: 1222, h: 1254 },
  logo: { src: 'img/hero.webp' },
  maps: { base: './' },
  calls: { base: './' },
  nav: [
    { label: 'Experience', at: 'w1' },
    { label: 'Conversation types', href: 'index.html' },
    { label: 'Voice samples', href: 'samples.html' },
    { label: 'Metrics', href: 'index.html' },
    { label: 'Results', href: 'results.html' },
  ],
  video: { src: 'flight.mp4', poster: 'img/poster.webp',
    // The whole film, end to end, at a walking pace. This page has nothing else to do.
    stops: [1.20, 8.00, 20.00, 36.00, 52.00, 68.00, 84.00, 96.00, 103.50] },
  // A cinema, not a document. Every stop is the film at full bleed with one line over it;
  // the line is the caption, the picture is the point. Written for someone who has never
  // heard of any of this.
  sections: [
    { id: 'w1', label: 'Welcome', block: 'cinema', stage: 'film', still: null,
      cam: { x: 0.500, y: 0.470, z: 1.00 }, scroll: 3.4, linger: 0.5,
      accent: 'var(--pillar-agentic)',
      big: 'Welcome to DuplexWorld',
      say: 'A day of ordinary errands, done by talking.' },
    { id: 'w2', label: 'The day', block: 'cinema', stage: 'film', still: null,
      cam: { x: 0.500, y: 0.470, z: 1.00 }, scroll: 3.2, linger: 0.5,
      accent: 'var(--pillar-agentic)',
      big: 'Six worlds. One day.',
      say: 'A bank, a hospital, an airline, an insurer, a courier, and a walk across a city '
         + 'you cannot see.' },
    { id: 'w3', label: 'Talking', block: 'cinema', stage: 'film', still: null,
      cam: { x: 0.500, y: 0.470, z: 1.00 }, scroll: 3.2, linger: 0.5,
      accent: 'var(--pillar-dynamics)',
      big: 'You talk. It talks back.',
      say: 'Both at once, the way people actually speak: interrupting, correcting, '
         + 'trailing off, starting again.' },
    { id: 'w4', label: 'Doing', block: 'cinema', stage: 'film', still: null,
      cam: { x: 0.500, y: 0.470, z: 1.00 }, scroll: 3.2, linger: 0.5,
      accent: 'var(--pillar-agentic)',
      big: 'Sounding right is not enough.',
      say: 'The card has to be frozen. The claim has to be filed. The walker has to reach '
         + 'the door.' },
    { id: 'w5', label: 'Failing', block: 'cinema', stage: 'film', still: null,
      cam: { x: 0.500, y: 0.470, z: 1.00 }, scroll: 3.2, linger: 0.5,
      accent: 'var(--pillar-natural)',
      big: 'Often it does not.',
      say: 'The best system finishes fewer than half of them on the first try.' },
    { id: 'w6', label: 'Scale', block: 'cinema', stage: 'film', still: null,
      cam: { x: 0.500, y: 0.470, z: 1.00 }, scroll: 3.2, linger: 0.5,
      accent: 'var(--pillar-dynamics)',
      big: '3,825 conversations.',
      say: '387 hours of speech, five commercial systems, every one of them scored the '
         + 'same way.' },
    { id: 'w7', label: 'Why', block: 'cinema', stage: 'film', still: null,
      cam: { x: 0.500, y: 0.470, z: 1.00 }, scroll: 3.2, linger: 0.5,
      accent: 'var(--pillar-agentic)',
      big: 'A different one leads each measure.',
      say: 'None is best at doing the job, holding the conversation and sounding human. '
         + 'That is the finding.' },
    { id: 'w8', label: 'Look', block: 'cinema', stage: 'film', still: null,
      cam: { x: 0.500, y: 0.470, z: 1.00 }, scroll: 3.0, linger: 0.5,
      accent: 'var(--pillar-agentic)',
      big: 'Hear it for yourself.',
      say: 'Real recordings, with the moment each one turns.',
      go: [['Listen to the calls', 'samples.html'], ['See the numbers', 'results.html']] },
    { id: 'out', label: 'DuplexWorld', stage: 'film', still: null, layout: 'hero',
      block: 'out',
      cam: { x: 0.500, y: 0.480, z: 1.02 }, scroll: 1.8, linger: 0.3,
      accent: 'var(--pillar-agentic)' },
  ],
});
</script>
