<body>

     otherwise cycle the header before reaching any content. -->

<main id="world"></main>

<!-- The walk renderer. Loaded before the flight so the map tiles can mount the moment their
     payloads land; if it is missing the flight still runs and the tiles stay as placeholders
     rather than throwing. -->
<script src="walkmap.js"></script>
<script>
window.__DW_ICONS = {
  openai: 'img/icons/openai.webp', gemini: 'img/icons/gemini.webp',
  grok: img/icons/grok.webp, nova: img/icons/nova.webp,
};
</script>
<script src="data.js"></script>
<script>window.__DW_AUTHORS = {"people": [{"name": "Aryan Vijay Bhosale", "sup": "1,2*"}, {"name": "Harshit Rajgarhia", "sup": "1*"}, {"name": "Akhil Pothanapalli", "sup": "1*"}, {"name": "Asif Shaik", "sup": "1"}, {"name": "Abhishek Mukherji", "sup": "1†"}, {"name": "Dinesh Manocha", "sup": "2†"}], "affiliations": [{"sup": "1", "name": "Centific Global Solutions Inc.", "href": "https://www.centific.com/research/applied-ai-research"}, {"sup": "2", "name": "University of Maryland", "href": "https://www.cs.umd.edu/"}], "email": "{aryan.bhosale, harshit.rajgarhia}@centific.com", "notes": ["Work done during an internship at Centific.", "* Equal contribution.  † Equal advising."]};</script>
<script src="flight.js"></script>
<script>
mountFlight(document.getElementById('world'), {
  shell: 'split',
  // THE OPENING. Not a stop: a block in normal flow, one viewport tall, that scrolls up
  // and off with the reader. Three by three with the mark in the middle cell. Nothing in
  // it fades and nothing in it moves - it simply leaves, the way the first screen of a
  // page should. Cells are given in reading order and the mark is inserted at index 4.


  // The dots go: a column of unlabelled marks is a slide-deck affordance, and this is a
  // page that is read by scrolling.
  rail: false,
  // The bar across the top. Each entry names a real section and spans to `to`, so the one
  // that lights is whichever range the reader is actually inside.
  hero: { src: 'img/hero.webp', w: 1222, h: 1254 },
  logo: { src: 'img/hero.webp' },
  maps: { base: './' },
  calls: { base: './' },
  // Every world, always on screen, each pointing at its own results stop - which is also
  // the moment the film is inside that world, so clicking one is a real flight to it.
  hint: 'scroll',
  nav: [
    { label: 'Conversation types', href: 'index.html' },
    { label: 'Voice samples', at: 'runs' },
    { label: 'Metrics', href: 'index.html' },
    { label: 'Results', href: 'results.html' },
  ],
  video: { src: 'flight.mp4', poster: 'img/poster.webp',
    // One entry per section, in section order. A length mismatch is not a soft
    // failure: the config is rejected and the film is dropped for the page.
    stops: [5.20, 103.50] },
  sections: [
    {
      id: 'runs', label: 'Voice samples', block: 'band', stage: 'art', still: null,
      // A clip, not a still: the walker turns from pointing at the tiles round to the
      // viewer, headphones on. Same globe, same render, so the stage keeps moving here
      // rather than freezing for one stop. Silent and looping.
      art: 'img/audio-turn.mp4',
      cam: { x: 0.500, y: 0.470, z: 1.00 }, scroll: 4.0, linger: 0.4,
      accent: 'var(--viod)',
      eyebrow: 'Audio samples from Duplex World',
      foot: 'Best experienced with headphones.',
      // `model` is the system that actually produced each recording, read off the payload's
      // own meta.agent. It is stated here rather than derived at paint time so the tile is
      // labelled before the payload finishes loading, and verify_paper.py asserts each one
      // back against meta.agent so the two can never drift.
      // Grouped by world, and every tile states which system is speaking. Each row carries
      // a PASSING and a FAILING run of the same shape wherever both were recorded: the
      // failures are the more informative half of this benchmark and a page that plays only
      // the successes is advertising, not evidence.
      runs: [
        // Pathfinding. Pressing play on one of these does not just start audio: the walk
        // renderer switches to the REAL call clock and opens its two-lane speech activity
        // timeline - who held the channel, where the two talked over each other, every
        // tool call and every audio effect the harness applied. That is the thing this
        // benchmark exists to measure, so it is what the play button shows.
        { map: 'clean', outcome: 'ok', type: 'Single intent', world: 'Pathfinding',
          model: 'Gemini-3.1-Flash-Live', voice: 'voice_clean.json' },
        // The failed single intent is the run that never arrives, not the one that
        // arrives inefficiently: `wander` ends on the same corner as the success, so on a
        // map it reads as a second success.
        { map: 'base_lost', outcome: 'bad', type: 'Single intent, failed',
          world: 'Pathfinding', model: 'GPT-Realtime-2.1-mini',
          voice: 'voice_base_lost.json' },
        { map: 'blocked_bad', outcome: 'bad', type: 'Rerouting, failed', world: 'Pathfinding',
          model: 'Voice Think Fast', voice: 'voice_blocked_bad.json' },
        // Turns 19-23: the charge surfaces inside the digression and the agent has to act
        // on it without over-reacting before the caller says it is not theirs.
        { call: 'bank_narr_ok', from: 19, to: 23, outcome: 'ok',
          type: 'Narrative intake', world: 'Banking', model: 'GPT-Realtime-2.1-mini',
          audio: 'audio/bank_narr_ok.opus' },
        { call: 'bank_narr_bad', from: 8, to: 13, outcome: 'bad',
          type: 'Narrative intake, failed', world: 'Banking', model: 'GPT-Realtime-2.1-mini',
          audio: 'audio/bank_narr_bad.opus' },
        // Turns 8-14: the code never arrives, the caller offers to read one down the line,
        // the agent refuses and steps up through the authenticator already on the account.
        { call: 'bank_ident_ok', from: 8, to: 14, outcome: 'ok',
          type: 'Identity verification', world: 'Travel', model: 'Gemini-3.1-Flash-Live',
          audio: 'audio/bank_ident_ok.opus' },
        { call: 'bank_ident_bad', from: 9, to: 14, outcome: 'bad',
          type: 'Identity verification, failed', world: 'Travel',
          model: 'Gemini-3.1-Flash-Live', audio: 'audio/bank_ident_bad.opus' },
        // Turns 17-21: she leaves mid-call and the agent has to hold every confirmed fact
        // across the gap, then read the code back before writing it.
        { call: 'bank_susp_ok', from: 17, to: 21, outcome: 'ok',
          type: 'Suspension', world: 'Travel', model: 'GPT-Realtime-2.1',
          audio: 'audio/bank_susp_ok.opus' },
      ],
    },
    // ---------------------------------------------------------------- the three pillars
    {
      id: 'out', label: 'Duplex World', stage: 'film', still: null, layout: 'hero',
      block: 'out',
      cam: { x: 0.500, y: 0.480, z: 1.02 }, scroll: 1.8, linger: 0.3,
      accent: 'var(--mag)',
    },
  ],
});
</script>
