<script>
mountFlight(document.getElementById('world'), {
  shell: 'split',
  rail: false,
  hero: { src: 'img/hero.webp', w: 1222, h: 1254 },
  logo: { src: 'img/hero.webp' },
  maps: { base: './' },
  calls: { base: './' },
  hint: 'scroll',
  nav: [
    { label: 'Experience', href: 'index.html' },
    { label: 'Overview', href: 'index.html#overview' },
    { label: 'Motivation', href: 'motivation.html' },
    { label: 'How it works', href: 'setup.html' },
    { label: 'Voice samples', href: 'samples.html' },
    { label: 'Metrics', href: 'metrics.html' },
    { label: 'Leaderboard', href: 'leaderboard.html' },
  ],
  video: { src: 'flight.mp4', srcSmall: 'flight-small.mp4', poster: 'img/poster.webp',
    // One entry per section, in section order. A length mismatch is not a soft
    // failure: the config is rejected and the film is dropped for the page.
    // Non-decreasing, which the validator requires and the flight needs: the camera only
    // ever moves forward through the film. This page shipped [2, 3, 2, 4, 103.5], which
    // steps BACK from 3 to 2, so videoOK_config rejected the whole config and the page has
    // been running with no film at all - the stage fell back to the computed camera and
    // nobody noticed because that fallback looks deliberate.
    // Four sections now, not five: the two maps stops split the old one, and the film outro
    // is gone. The chain no longer runs to the end of the clip because nothing on this page
    // shows the last twenty seconds any more - the two maps stops sit either side of the
    // dive into Pathfinding, which is the part of the film they belong to.
    stops: [2.00, 20.00, 41.65, 60.00, 80.24] },
  sections: [
    {
      id: 'harness', label: 'The harness', stage: 'film', still: null,
      cam: { x: 0.500, y: 0.470, z: 1.00 }, scroll: 2.8, linger: 0.4,
      accent: 'var(--pillar-dynamics)',
      eyebrow: 'The harness',
      title: 'Nobody picks up the phone.',
      body: 'The caller is three models working together and the agent is a commercial '
          + 'speech-to-speech system. Both talk on the same clock, so a slow system and a '
          + 'fast one produce traces you can compare.',
      harness: {
        callerNote: 'simulated',
        caller: [
          { role: 'Writes the words', model: 'gpt-5.6-luna',
            says: 'What the caller says next, given the scenario and what it has heard.' },
          { role: 'Decides when to speak', model: 'claude-haiku-4.5',
            says: 'Two independent yes/no calls every 2 seconds while the agent is '
                + 'talking: interrupt, and backchannel. Turn-taking lives here, not in '
                + 'the agent.' },
          { role: 'Says them out loud', model: 'ElevenLabs eleven_v3',
            says: 'Every caller utterance is synthesised. No human speech was recorded.' },
        ],
        midHead: 'both at once',
        tick: '200 ms ticks',
        midNote: 'The caller starts before the agent has finished, and for a moment both '
               + 'are speaking - which is the thing this benchmark measures.',
        agentNote: 'under test',
        agentRole: 'Hears audio, answers in audio',
        agentSays: 'One of five commercial speech-to-speech systems. It is never told '
                 + 'whose turn it is.',
        systems: ['Grok Voice Think Fast 1.0', 'GPT-Realtime-2.1', 'Gemini-3.1-Flash-Live',
                  'GPT-Realtime-2.1-mini', 'Nova 2 Sonic'],
        more: { label: 'Watch one call run, tick by tick', href: 'system.html' },
      },
    },
    {
      /* THE EXAMPLE. Its own stop, and a full-width one.
         The claim it answers is on the diagram above - both sides hold the channel at once -
         and it belongs next to it, but not IN it: the harness panel is already the tallest
         thing on this page, and adding ninety seconds of call to it pushed the panel past
         the height of its own column, so the column scrolled inside itself. On a
         scroll-driven page that reads as the wheel having stopped working.
         Full width because the thing being shown is a CLOCK, and a clock cut to half the
         page is a clock at half the resolution. */
      id: 'example', label: 'One real call', block: 'band', stage: 'film', still: null,
      cam: { x: 0.500, y: 0.470, z: 1.00 }, scroll: 2.6, linger: 0.4,
      accent: 'var(--pillar-dynamics)',
      eyebrow: 'What that produces',
      title: 'One real call, in the first ninety seconds.',
      // Read out of a shipped recording at run time rather than typed here, so the lines,
      // the times and the size of every overlap are the recording's and not an author's
      // memory of it.
      example: {
        call: 'bank_narr_ok',
        seconds: 90,
        turns: 2,
        lede: 'Banking · narrative intake · GPT-Realtime-2.1-mini · a passing run',
        more: { label: 'Watch a whole call, tick by tick', href: 'system.html' },
      },
    },
    {
      id: 'walks', label: 'Pathfinding types', block: 'band', stage: 'film', still: null,
      lede: 'The agent holds the map. The walker holds the street. Neither can see what '
          + 'the other sees.',
      navCards: [
        { name: 'Single intent',
          line: 'Five blocks, two turns, nothing closed. The control condition.' },
        { name: 'Rerouting',
          line: 'Four closures the copilot\u2019s map does not show. Exactly one detour survives.' },
        { name: 'All-day assistance',
          line: 'A second destination, revealed only on arrival at the first.' },
      ],
      cam: { x: 0.346, y: 0.601, z: 1.75 }, scroll: 4.7, linger: 0.5, steps: 3,
      accent: 'var(--mag)',
      mark: { name: 'Pathfinding', line: 'Three conversation types, each shown solved.' },
      // No paragraph. The tiles are the argument, the types are named on them, and the
      // paper already explains each one at length.
      maps: {
        cols: 3,
        // Figures 3, 4 and 5, the solved half. Three tiles in ONE row, so each walk gets the
        // full height of the band rather than half of it: at 200px of map the walker's label
        // and the copilot's label printed on top of each other.
        cells: [
          { key: 'clean', at: 0, outcome: 'ok', cond: 'Single intent', verdict: 'Pass',
            note: 'Five blocks of five, two turns, no closures.' },
          { key: 'blocked_ok', at: 1, outcome: 'ok', cond: 'Rerouting', verdict: 'Pass',
            note: 'Four unmapped closures; finds the one detour that survives.' },
          { key: 'errand_ok', at: 2, outcome: 'ok', cond: 'All-day assistance', verdict: 'Pass',
            note: 'The second destination is revealed only on arrival at the first.' },
        ],
      },
    },
    {
      // THE SAME THREE, UNSOLVED, beside the runs that solved them. Its own stop rather than
      // a fourth reveal step on the one above: six tiles at once is the comparison, and the
      // comparison only lands if the reader has already read the three that worked.
      id: 'walks-fail', label: 'Solved and unsolved', block: 'band', stage: 'film', still: null,
      cam: { x: 0.346, y: 0.601, z: 1.75 }, scroll: 4.0, linger: 0.5,
      accent: 'var(--mag)',
      mark: { name: 'Pathfinding', line: 'Each type, shown solved and unsolved.' },
      maps: {
        cols: 3,
        lede: 'Now the same three, unsolved. Each pair shares a start, a destination and a '
            + 'closure set, so the only thing that differs between two tiles is the agent.',
        // `all`, so every tile is up from the first frame. The staged reveal belongs to the
        // stop above; replaying it here would build the three passes a second time.
        all: true,
        cells: [
          { key: 'clean', at: 0, outcome: 'ok', cond: 'Single intent', verdict: 'Pass',
            note: 'Five blocks of five, two turns, no closures.' },
          { key: 'blocked_ok', at: 1, outcome: 'ok', cond: 'Rerouting', verdict: 'Pass',
            note: 'Four unmapped closures; finds the one detour that survives.' },
          { key: 'errand_ok', at: 2, outcome: 'ok', cond: 'All-day assistance', verdict: 'Pass',
            note: 'The second destination is revealed only on arrival at the first.' },
          // `wander` used to sit here and it ARRIVES: eleven blocks against a five block
          // optimum, ending on the same corner as the success beside it, so on a map it
          // read as a second success. This run never reaches the pharmacy at all.
          { key: 'base_lost', at: 0, outcome: 'bad', cond: 'Single intent', verdict: 'Fail',
            note: 'Fifteen blocks, seven wrong turns, and the call ends short of the door.' },
          { key: 'blocked_bad', at: 1, outcome: 'bad', cond: 'Rerouting', verdict: 'Fail',
            note: 'The same closures, never resolved.' },
          { key: 'errand_bad', at: 2, outcome: 'bad', cond: 'All-day assistance', verdict: 'Fail',
            note: 'Ends with the walker believing they had arrived.' },
        ],
      },
    },
    {
      id: 'types9', label: 'Conversation types', stage: 'film', still: null,
      // Its own block: nine cards want every column they can get, and the film beside them
      // is context rather than evidence here, so the panel keeps its width and the graphic
      // gives ground instead.
      block: 'band',
      cam: { x: 0.500, y: 0.470, z: 1.00 }, scroll: 2.6, linger: 0.4,
      accent: 'var(--pillar-agentic)',
      cardsLede: 'Nine shapes, shared by all five enterprise worlds.',
      cards: TYPES9,
      cardsFoot: 'Plus two that only navigation elicits: rerouting, and all-day assistance.',
      // The hand-off used to be a stop of its own, a full-screen scrub of the dome with one
      // link on it. It was the film for its own sake: this page's argument finishes with the
      // nine cards, and a whole viewport of video after it is a pause, not an ending. The
      // link moves onto the card grid and the stop goes.
      next: { kicker: 'Next', label: 'Hear the calls', href: 'samples.html' },
    },
  ],
});
</script>
