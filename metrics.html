<script>
mountFlight(document.getElementById('world'), {
  shell: 'split',
  rail: false,
  hero: { src: 'img/hero.webp', w: 1222, h: 1254 },
  logo: { src: 'img/hero.webp' },
  maps: { base: './' },
  calls: { base: './' },
  hint: 'scroll',
  nav: [
    { label: 'Experience', href: 'index.html' },
    { label: 'Overview', href: 'index.html#overview' },
    { label: 'Motivation', href: 'motivation.html' },
    { label: 'How it works', href: 'setup.html' },
    { label: 'Voice samples', href: 'samples.html' },
    { label: 'Metrics', href: 'metrics.html' },
    { label: 'Leaderboard', href: 'leaderboard.html' },
  ],
  // NO FILM ON THIS PAGE, deliberately.
  // ------------------------------------------------------------------------------------
  // Two sections is one leg, so the film had to cross 96 of its 104 seconds in a single
  // band: 27 film-seconds per viewport-height against the 8 or 9 the Experience page runs
  // at. That is not a flight, it is a fast-forward, and it was pulling attention off the
  // metric definitions this page exists to state. With `video` absent the stage falls back
  // to the mark, which is what the reader should be looking past here anyway. Dropping it
  // also stops the page fetching a 38.9 MB blob it had no use for.
  sections: [
    {
      id: 'pillars3', label: 'The metrics', stage: 'film', still: null,
      // Three columns of eleven metric cards, a worked example and the callout do not fit
      // one viewport beside a film. This is the section the directive asks to be three
      // full-width columns, so the stage stands down and the evidence takes the page.
      block: 'band',
      cam: { x: 0.500, y: 0.470, z: 1.00 }, scroll: 5.3, linger: 0.4,
      accent: 'var(--pillar-dynamics)',
      next: { kicker: 'Next', label: 'What the five systems scored', href: 'leaderboard.html' },
      // The definitions on their own were a glossary the paper already has. This is the
      // same five runs of one Pathfinding scenario that the numbers beside them come from,
      // so a reader watches GS, Pass@1 and Pass-cubed fall out of one set of runs and can
      // see they are three different questions rather than three spellings of one.
      worked: {
        label: 'One scenario, five runs',
        optimal: 7,
        limit: 0.75,
        runs: [{ blocks: 8 }, { blocks: 19 }, { blocks: 7 }, { blocks: 9 }, { blocks: 0 }],
      },
      // Three pillars, each a column with its own colour, and every metric stated four
      // ways: symbol, full name, one plain sentence for a reader who has not read the
      // paper, and the range with its direction. The glossary this replaces named the
      // metrics without ever saying what they mean or which way is better.
      pillarCols: [
        { name: 'Agentic capability', tint: 'var(--pillar-agentic)',
          line: 'Did it do the job.',
          metrics: [
            { sym: 'GS', full: 'Goal state',
              says: 'Did the world end up the way the task asked, whatever was said on the way.',
              range: '[0,1] \u00b7 higher is better' },
            { sym: 'Pass@1', full: 'Single-run pass rate',
              says: 'How often one attempt succeeds. This is the headline number.',
              range: '[0,1] \u00b7 higher is better' },
            { sym: 'Pass@3', full: 'Any of three',
              says: 'At least one success in three independent attempts. Rewards a system that is sometimes right.',
              range: '[0,1] \u00b7 higher is better' },
            { sym: 'Pass\u00b3', full: 'All of three',
              says: 'All three attempts succeed. This is the reliability question, and it is where systems separate.',
              range: '[0,1] \u00b7 higher is better' },
          ] },
        { name: 'Conversational dynamics', tint: 'var(--pillar-dynamics)',
          line: 'How the conversation went.',
          metrics: [
            { sym: 'TT', full: 'Turn-taking',
              says: 'Who held the channel, who yielded, and how often the two talked over each other.',
              range: '[0,1] \u00b7 higher is better' },
            { sym: 'CP', full: 'Conversation progression',
              says: 'Whether each turn moved the task forward rather than circling.',
              range: '[1,3] \u00b7 higher is better' },
            { sym: 'SEL', full: 'Selectivity',
              says: 'Whether the agent ignored what was not addressed to it: background speech, asides, a second voice in the room.',
              range: '[0,1] \u00b7 higher is better' },
          ] },
        { name: 'Naturalness', tint: 'var(--pillar-natural)',
          line: 'How it sounded.',
          metrics: [
            { sym: 'FAI', full: 'Faithfulness',
              says: 'Whether what the agent said was true of the world it was acting in.',
              range: '[1,3] \u00b7 higher is better' },
            { sym: 'DNSMOS', full: 'Speech quality (DNSMOS)',
              says: 'A predicted mean opinion score for the audio, from a model trained on human ratings.',
              range: '[1,5] \u00b7 higher is better' },
            { sym: 'UTMOS', full: 'Speech quality (UTMOS)',
              says: 'A second, independently trained MOS predictor. Three are reported because they disagree.',
              range: '[1,5] \u00b7 higher is better' },
            { sym: 'NISQA', full: 'Speech quality (NISQA)',
              says: 'A third MOS predictor, on a different training set again.',
              range: '[1,5] \u00b7 higher is better' },
          ] },
      ],
      callout: {
        head: 'We never combine these into a single score.',
        body: 'A system that says nothing scores near-perfect selectivity and competitive '
            + 'turn-taking. Any composite that averages across the pillars can be won by '
            + 'silence.',
      },
    },
  ],
});
</script>
